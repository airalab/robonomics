[package]
name = "pallet-robonomics-subscription-purchase"
description = "Robonomics subscription purchase allocator: fixed-product acquisition of subscriptions."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
ignored = ["parity-scale-codec", "scale-info"]

[dependencies]
parity-scale-codec.workspace = true
scale-info.workspace = true
polkadot-sdk = { workspace = true, features = [
  "sp-runtime",
  "frame-system",
  "frame-support",
] }
robonomics-subscription-primitives.workspace = true

[dev-dependencies]
polkadot-sdk = { workspace = true, features = ["std", "sp-io"] }
pallet-robonomics-subscription.workspace = true
pallet-robonomics-subscription-governance.workspace = true

[features]
default = ["std"]
std = [
  "parity-scale-codec/std",
  "scale-info/std",
  "polkadot-sdk/std",
  "robonomics-subscription-primitives/std",
  "pallet-robonomics-subscription/std",
  "pallet-robonomics-subscription-governance/std",
]

runtime-benchmarks = [
  "polkadot-sdk/runtime-benchmarks",
  "polkadot-sdk/frame-benchmarking",
  "pallet-robonomics-subscription/runtime-benchmarks",
  "pallet-robonomics-subscription-governance/runtime-benchmarks",
]

try-runtime = [
  "polkadot-sdk/try-runtime",
  "pallet-robonomics-subscription/try-runtime",
  "pallet-robonomics-subscription-governance/try-runtime",
]
