[package]
name = "pallet-robonomics-datalog"
description = "Robonomics Network data logging Substrate runtime module"
version = "1.4.1"
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["parity-scale-codec", "scale-info"]

[dependencies]
parity-scale-codec.workspace = true
scale-info.workspace = true
polkadot-sdk = { workspace = true, features = [
  "sp-std",
  "sp-runtime",
  "frame-system",
  "frame-support",
] }

[dev-dependencies]
polkadot-sdk = { workspace = true, features = [
  "std",
  "sp-io",
  "sp-core",
  "pallet-timestamp",
] }

[features]
default = ["std"]
std = ["parity-scale-codec/std", "scale-info/std", "polkadot-sdk/std"]

runtime-benchmarks = [
  "polkadot-sdk/runtime-benchmarks",
  "polkadot-sdk/frame-benchmarking",
]

try-runtime = ["polkadot-sdk/try-runtime"]
