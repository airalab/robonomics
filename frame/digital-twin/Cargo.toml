[package]
name = "pallet-robonomics-digital-twin"
description = "Robonomics Network digital twin runtime module"
version = "0.4.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["parity-scale-codec", "scale-info"]

[dependencies]
parity-scale-codec.workspace = true
scale-info.workspace = true
polkadot-sdk = { workspace = true, features = [
  "sp-std",
  "sp-core",
  "sp-runtime",
  "frame-system",
  "frame-support",
] }

[dev-dependencies]
polkadot-sdk = { workspace = true, features = ["std", "sp-io"] }

[features]
default = ["std"]
std = ["parity-scale-codec/std", "scale-info/std", "polkadot-sdk/std"]

runtime-benchmarks = [
  "polkadot-sdk/runtime-benchmarks",
  "polkadot-sdk/frame-benchmarking",
]

try-runtime = ["polkadot-sdk/try-runtime"]
