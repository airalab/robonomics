[package]
name = "pallet-robonomics-liability"
description = "Robonomics Network Robot Liability Substrate runtime module"
version = "0.11.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["parity-scale-codec", "scale-info"]

[dependencies]
parity-scale-codec.workspace = true
scale-info.workspace = true
hex-literal.workspace = true
polkadot-sdk = { workspace = true, features = [
  "sp-std",
  "sp-core",
  "sp-runtime",
  "frame-system",
  "frame-support",
] }

[dev-dependencies]
hex-literal.workspace = true
polkadot-sdk = { workspace = true, features = [
  "std",
  "pallet-balances",
  "sp-io",
  "sp-keyring",
] }

[features]
default = ["std"]
std = ["parity-scale-codec/std", "scale-info/std", "polkadot-sdk/std"]

runtime-benchmarks = [
  "polkadot-sdk/runtime-benchmarks",
  "polkadot-sdk/frame-benchmarking",
  "polkadot-sdk/pallet-balances",
]

try-runtime = ["polkadot-sdk/try-runtime"]
