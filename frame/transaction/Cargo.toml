[package]
name = "pallet-robonomics-transaction"
description = "Robonomics transaction runtime module: Subscription Transaction resource consumer and payment routing."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
ignored = ["parity-scale-codec", "scale-info"]

[dependencies]
parity-scale-codec.workspace = true
scale-info.workspace = true
sp-runtime.workspace = true
frame-system.workspace = true
frame-support.workspace = true
pallet-transaction-payment.workspace = true
robonomics-subscription-primitives.workspace = true

[dev-dependencies]
sp-io.workspace = true
pallet-balances.workspace = true
pallet-robonomics-cps.workspace = true
pallet-robonomics-subscription.workspace = true

[features]
default = ["std"]
std = [
  "parity-scale-codec/std",
  "scale-info/std",
  "sp-runtime/std",
  "sp-io/std",
  "frame-system/std",
  "frame-support/std",
  "pallet-transaction-payment/std",
  "pallet-balances/std",
  "pallet-robonomics-cps/std",
  "pallet-robonomics-subscription/std",
  "robonomics-subscription-primitives/std",
]

runtime-benchmarks = [
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
  "sp-runtime/runtime-benchmarks",
  "pallet-transaction-payment/runtime-benchmarks",
  "pallet-balances/runtime-benchmarks",
  "pallet-robonomics-cps/runtime-benchmarks",
  "pallet-robonomics-subscription/runtime-benchmarks",
]

try-runtime = [
  "frame-support/try-runtime",
  "frame-system/try-runtime",
  "sp-runtime/try-runtime",
  "pallet-transaction-payment/try-runtime",
  "pallet-balances/try-runtime",
  "pallet-robonomics-cps/try-runtime",
  "pallet-robonomics-subscription/try-runtime",
]
