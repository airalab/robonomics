[package]
name = "robonomics-runtime-metadata"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Robonomics runtime SCALE-encoded metadata, extraction and validation."
build = "build.rs"

[build-dependencies]
robonomics-runtime.workspace = true
robonomics-runtime.optional = true
sp-io.workspace = true
sp-io.optional = true
sp-state-machine.workspace = true
sp-state-machine.optional = true
sp-maybe-compressed-blob.workspace = true
sp-maybe-compressed-blob.optional = true
sc-executor.workspace = true
sc-executor.optional = true
sc-executor-common.workspace = true
sc-executor-common.optional = true
parity-scale-codec.workspace = true
parity-scale-codec.optional = true
seahash.workspace = true
seahash.optional = true

[dev-dependencies]
frame-metadata = { workspace = true, features = ["std", "unstable"] }
parity-scale-codec.workspace = true

[features]
build-metadata = [
  "robonomics-runtime",
  "sp-io",
  "sp-state-machine",
  "sp-maybe-compressed-blob",
  "sc-executor",
  "sc-executor-common",
  "parity-scale-codec",
]
check-metadata = ["build-metadata", "seahash"]
# Build metadata for development runtime (have sudo, different constants, etc)
dev-runtime = ["robonomics-runtime?/dev-runtime"]
