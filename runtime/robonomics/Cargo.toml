[package]
name = "robonomics-runtime"
description = "Robonomics Network WASM runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
# third-party dependencies
parity-scale-codec.workspace = true
smallvec.workspace = true
scale-info.workspace = true
serde_json = { features = ["alloc"], workspace = true }

# Polkadot SDK crates (sp-*, frame-*, pallet-*, cumulus-*, staging-xcm*, polkadot-*)
polkadot-sdk = { workspace = true, features = [
  "sp-api",
  "sp-block-builder",
  "sp-core",
  "sp-inherents",
  "sp-offchain",
  "sp-runtime",
  "sp-session",
  "sp-std",
  "sp-transaction-pool",
  "sp-version",
  "sp-genesis-builder",
  "sp-consensus-aura",
  "sp-keyring",
  "pallet-aura",
  "pallet-authorship",
  "pallet-balances",
  "pallet-collator-selection",
  "frame-executive",
  "frame-metadata-hash-extension",
  "pallet-session",
  "frame-support",
  "pallet-multisig",
  "pallet-message-queue",
  "pallet-proxy",
  "frame-system",
  "frame-system-rpc-runtime-api",
  "pallet-utility",
  "pallet-vesting",
  "pallet-timestamp",
  "pallet-transaction-payment",
  "pallet-transaction-payment-rpc-runtime-api",
  "pallet-sudo",
  "pallet-preimage",
  "pallet-scheduler",
  "pallet-referenda",
  "pallet-conviction-voting",
  "pallet-whitelist",
  "pallet-collective",
  "cumulus-pallet-aura-ext",
  "cumulus-pallet-xcmp-queue",
  "cumulus-pallet-xcm",
  "cumulus-pallet-weight-reclaim",
  "cumulus-primitives-aura",
  "cumulus-primitives-core",
  "cumulus-primitives-utility",
  "staging-parachain-info",
  "staging-xcm",
  "staging-xcm-builder",
  "staging-xcm-executor",
  "xcm-runtime-apis",
  "pallet-xcm",
  "pallet-xcm-benchmarks",
  "polkadot-parachain-primitives",
  "polkadot-runtime-common",
] }
# `register_validate_block!` resolves this crate by name, so it stays a direct dependency.
cumulus-pallet-parachain-system.workspace = true
hex-literal.workspace = true

# robonomics dependencies
pallet-robonomics-datalog.workspace = true
pallet-robonomics-digital-twin.workspace = true
pallet-robonomics-launch.workspace = true
pallet-robonomics-liability.workspace = true
pallet-robonomics-rws.workspace = true
pallet-robonomics-cps.workspace = true
pallet-robonomics-subscription.workspace = true
pallet-robonomics-subscription-governance.workspace = true
pallet-robonomics-subscription-purchase.workspace = true
pallet-robonomics-transaction.workspace = true
robonomics-subscription-primitives.workspace = true
robonomics-collator-rewards.workspace = true

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true }

[dev-dependencies]
polkadot-sdk = { workspace = true, features = ["std", "sp-io"] }

[features]
default = ["std"]
with-tracing = ["polkadot-sdk/with-tracing"]
std = [
  "substrate-wasm-builder",
  "polkadot-sdk/std",
  "parity-scale-codec/std",
  "scale-info/std",
  "cumulus-pallet-parachain-system/std",
  "pallet-robonomics-datalog/std",
  "pallet-robonomics-digital-twin/std",
  "pallet-robonomics-launch/std",
  "pallet-robonomics-liability/std",
  "pallet-robonomics-rws/std",
  "pallet-robonomics-cps/std",
  "pallet-robonomics-subscription/std",
  "pallet-robonomics-subscription-governance/std",
  "pallet-robonomics-subscription-purchase/std",
  "pallet-robonomics-transaction/std",
  "robonomics-subscription-primitives/std",
  "robonomics-collator-rewards/std",
]
runtime-benchmarks = [
  "polkadot-sdk/runtime-benchmarks",
  "polkadot-sdk/frame-benchmarking",
  "polkadot-sdk/frame-system-benchmarking",
  "polkadot-sdk/cumulus-pallet-session-benchmarking",
  "polkadot-sdk/sp-io",
  "cumulus-pallet-parachain-system/runtime-benchmarks",
  "pallet-robonomics-datalog/runtime-benchmarks",
  "pallet-robonomics-digital-twin/runtime-benchmarks",
  "pallet-robonomics-launch/runtime-benchmarks",
  "pallet-robonomics-liability/runtime-benchmarks",
  "pallet-robonomics-rws/runtime-benchmarks",
  "pallet-robonomics-cps/runtime-benchmarks",
  "pallet-robonomics-subscription/runtime-benchmarks",
  "pallet-robonomics-subscription-governance/runtime-benchmarks",
  "pallet-robonomics-subscription-purchase/runtime-benchmarks",
  "pallet-robonomics-transaction/runtime-benchmarks",
]
try-runtime = [
  "polkadot-sdk/try-runtime",
  "polkadot-sdk/frame-try-runtime",
  "cumulus-pallet-parachain-system/try-runtime",
  "pallet-robonomics-datalog/try-runtime",
  "pallet-robonomics-digital-twin/try-runtime",
  "pallet-robonomics-launch/try-runtime",
  "pallet-robonomics-liability/try-runtime",
  "pallet-robonomics-rws/try-runtime",
  "pallet-robonomics-cps/try-runtime",
  "pallet-robonomics-subscription/try-runtime",
  "pallet-robonomics-subscription-governance/try-runtime",
  "pallet-robonomics-subscription-purchase/try-runtime",
  "pallet-robonomics-transaction/try-runtime",
  "robonomics-collator-rewards/try-runtime",
]

# Enable the metadata hash generation in the wasm builder.
metadata-hash = ["substrate-wasm-builder/metadata-hash"]

# A feature that should be enabled when the runtime should be built for on-chain
# deployment. This will disable stuff that shouldn't be part of the on-chain wasm
# to make it smaller, like logging for example.
on-chain-release-build = ["metadata-hash"]

# Use development pallets & parameters in runtime.
dev-runtime = []
