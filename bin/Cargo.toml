[package]
name = "robonomics"
description = "The Robonomics Network Omni Node."
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "robonomics"
path = "src/main.rs"

[dependencies]
robonomics-runtime = { workspace = true, optional = true }
sp-genesis-builder = { workspace = true, optional = true }
polkadot-omni-node-lib.workspace = true
color-eyre.workspace = true

[dev-dependencies]
assert_cmd.workspace = true

[build-dependencies]
substrate-build-script-utils = { workspace = true, default-features = true }

[features]
default = []
runtime-benchmarks = ["polkadot-omni-node-lib/runtime-benchmarks"]
try-runtime = ["polkadot-omni-node-lib/try-runtime"]
dev-runtime = ["robonomics-runtime?/dev-runtime", "sp-genesis-builder"]
