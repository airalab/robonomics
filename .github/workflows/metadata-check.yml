name: Subxt API Metadata Check
permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
    paths:
      - 'runtime/**'
      - 'frame/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'runtime/**'
      - 'frame/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_call:

concurrency:
  group: metadata-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check-metadata:
    name: Runtime Metadata Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check metadata
        run: cargo build -p robonomics-runtime-subxt-api --features check-metadata --release --locked
